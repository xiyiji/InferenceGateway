name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cpu-contract-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install CPU test dependencies
        run: pip install pytest fastapi pydantic numpy
      - name: Run API contract and statistics tests
        run: pytest -q tests/
